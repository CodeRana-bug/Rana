<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Customer</title>

</head>


<body>

    <h1>Edit Customer</h1>


    <form method="POST">

        {% csrf_token %}


        <div>

            <label>Name</label>

            <input
                type="text"
                name="name"
                value="{{ customer.name }}"
                required
            >

        </div>


        <br>


        <div>

            <label>Email</label>

            <input
                type="email"
                name="email"
                value="{{ customer.email }}"
                required
            >

        </div>


        <br>


        <div>

            <label>Phone</label>

            <input
                type="text"
                name="phone"
                value="{{ customer.phone }}"
                required
            >

        </div>


        <br>


        <div>

            <label>Company</label>

            <input
                type="text"
                name="company"
                value="{{ customer.company }}"
            >

        </div>


        <br>


        <button type="submit">
            Update Customer
        </button>

    </form>


    <br>


    <a href="{% url 'customer_list' %}">
        ← Back to Customers
    </a>


</body>

</html>
