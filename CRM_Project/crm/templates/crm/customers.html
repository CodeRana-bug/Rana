<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Customers</title>

</head>


<body>

    <h1>Customers</h1>


    {% for customer in customers %}

        <div>

            <h3>
                {{ customer.name }}
            </h3>

            <p>
                Email: {{ customer.email }}
            </p>

            <p>
                Phone: {{ customer.phone }}
            </p>

            <p>
                Company: {{ customer.company }}
            </p>

        </div>

        <hr>

    {% empty %}

        <p>
            No customers found.
        </p>

    {% endfor %}

</body>

</html>
