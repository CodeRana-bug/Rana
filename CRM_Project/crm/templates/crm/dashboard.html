<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CRM Dashboard</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f8fafc;
            color: #0f172a;
        }

        .dashboard {
            display: flex;
            min-height: 100vh;
        }

        /* ================= SIDEBAR ================= */

        .sidebar {
            width: 240px;
            background: #0f172a;
            color: white;
            padding: 25px 18px;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 40px;
            padding-left: 10px;
        }

        .logo span {
            color: #6366f1;
        }

        .menu {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .menu a {
            color: #cbd5e1;
            text-decoration: none;
            padding: 12px 14px;
            border-radius: 8px;
            transition: .2s;
        }

        .menu a:hover,
        .menu a.active {
            background: #6366f1;
            color: white;
        }

        /* ================= MAIN ================= */

        .main-content {
            flex: 1;
            padding: 35px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 35px;
        }

        .topbar h1 {
            font-size: 30px;
        }

        .topbar p {
            color: #64748b;
            margin-top: 5px;
        }

        .user {
            background: white;
            padding: 10px 16px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            font-weight: 600;
        }

        /* ================= CARDS ================= */

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 14px;
            border: 1px solid #e2e8f0;
            transition: .25s;
        }

        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 15px 35px rgba(15, 23, 42, .08);
        }

        .stat-card h3 {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .stat-card .number {
            font-size: 32px;
            font-weight: 800;
            color: #6366f1;
        }

        /* ================= RESPONSIVE ================= */

        @media (max-width: 800px) {

            .sidebar {
                width: 190px;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .main-content {
                padding: 25px;
            }

        }

        @media (max-width: 600px) {

            .dashboard {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
            }

            .menu {
                flex-direction: row;
                flex-wrap: wrap;
            }

            .topbar {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

        }

    </style>

</head>


<body>

<div class="dashboard">


    <!-- ================= SIDEBAR ================= -->

    <aside class="sidebar">

        <div class="logo">
            CRM<span>.</span>
        </div>

        <nav class="menu">

            <a href="/" class="active">
                📊 Dashboard
            </a>

            <a href="#">
                👥 Customers
            </a>

            <a href="#">
                🎯 Leads
            </a>

            <a href="#">
                ✅ Tasks
            </a>

            <a href="#">
                📈 Reports
            </a>

        </nav>

    </aside>


    <!-- ================= MAIN CONTENT ================= -->

    <main class="main-content">


        <div class="topbar">

            <div>

                <h1>
                    Dashboard
                </h1>

                <p>
                    Welcome to your CRM dashboard.
                </p>

            </div>


            <div class="user">

                Rahul

            </div>

        </div>


        <!-- ================= STATS ================= -->

        <div class="stats-grid">


            <div class="stat-card">

                <h3>
                    Total Customers
                </h3>

                <div class="number">
                    {{ total_customers }}
                </div>

            </div>


            <div class="stat-card">

                <h3>
                    Total Leads
                </h3>

                <div class="number">
                    0
                </div>

            </div>


            <div class="stat-card">

                <h3>
                    Pending Tasks
                </h3>

                <div class="number">
                    0
                </div>

            </div>


        </div>


    </main>

</div>

</body>

</html>
